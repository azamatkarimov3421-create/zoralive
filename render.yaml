services:
  - type: web
    name: zoralive-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: "https://zoralive.vercel.app"
